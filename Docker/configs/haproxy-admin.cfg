global
    log stdout format raw local0
    maxconn 4096

defaults
    log     global
    mode    http
    option  httplog
    timeout connect 5s
    timeout client  50s
    timeout server  50s

# Lista de usuarios autorizados
userlist admin_users
    user admin insecure-password admin

# Frontend para herramientas de administración
frontend admin_front
    bind *:8085
    mode http
    
    # Verificar autenticación
    acl auth_ok http_auth(admin_users)
    http-request auth realm "Area de Administracion - Acceso Restringido" if !auth_ok
    
    # ACLs para rutas de admin
    acl is_adminer path_beg /adminer
    acl is_grafana path_beg /grafana
    acl is_prometheus path_beg /prometheus
    acl is_mantis path_beg /mantis
    
    # Enrutamiento
    use_backend adminer_back if is_adminer
    use_backend grafana_back if is_grafana
    use_backend prometheus_back if is_prometheus
    use_backend mantis_back if is_mantis
    
    # Por defecto, redirigir a Grafana
    default_backend grafana_back

backend adminer_back
    mode http
    server adminer adminer:8080 check

backend grafana_back
    mode http
    server grafana grafana:3000 check

backend prometheus_back
    mode http
    http-request set-path %[path,regsub(^/prometheus,/)]
    server prometheus prometheus:9090 check

backend mantis_back
    mode http
    server mantis mantisbt:80 check

