<div class="position-relative mt-2 mb-3">
    <!-- Botón Anterior -->
    <button class="btn btn-light rounded-circle position-absolute top-50 translate-middle-y ms-3 z-1 d-none d-md-block"
        style="width: 50px; height: 50px; left: -75px;" (click)="anterior()">
        <i class="bi bi-chevron-left m-auto"></i>
    </button>
    
    <button class="btn btn-light rounded-circle position-absolute top-50 translate-middle-y me-3 z-1 d-none d-md-block"
        style="width: 50px; height: 50px; right: -75px;" (click)="siguiente()">
        <i class="bi bi-chevron-right m-auto"></i>
    </button>

    <!-- Contenedor de tarjetas -->
    <div class="container px-2">
        <div class="row justify-content-center g-4 fade-in" *ngIf="visibleCards.length > 0">
            <div class="col-12 col-sm-10 col-md-6 col-lg-4" *ngFor="let noticia of visibleCards">
                <div class="card h-100 card-hover-effect shadow-sm">
                    <img [src]="noticia.imagenUrl" class="card-img-top img-fluid" [alt]="noticia.titulo"
                        style="height: 180px; object-fit: cover;">
                    <div class="card-body d-flex flex-column">
                        <div class="card-title-border">
                            <h5 class="card-title">{{ noticia.titulo }}</h5>
                        </div>
                        <p class="card-text flex-grow-1">
                            {{ noticia.message | slice: 0:150 }}{{ noticia.message.length > 150 ? '...' : '' }}
                            <a *ngIf="noticia.message.length > 150" [routerLink]="['/noticias-detalle']" [queryParams]="{id: noticia._id}"
                                class="btn btn-outline-primary btn-sm mt-2">
                                Leer más <i class="fas fa-arrow-right ms-1"></i>
                            </a>

                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<div class="d-flex justify-content-center mt-3 mb-2 d-md-none">
    <button class="btn btn-light rounded-circle mx-2" 
            style="width: 45px; height: 45px;" 
            (click)="anterior()">
        <i class="bi bi-chevron-left"></i>
    </button>
    
    <button class="btn btn-light rounded-circle mx-2" 
            style="width: 45px; height: 45px;" 
            (click)="siguiente()">
        <i class="bi bi-chevron-right"></i>
    </button>
</div>


<!-- Indicadores -->
<div class="d-flex justify-content-center pb-2">
    <div *ngFor="let pageIndex of getPageIndices(); let i = index" class="rounded-circle mx-1" [ngStyle]="{
         'background-color': isActive(i) ? 'var(--primary-blue)' : 'var(--primary-blue-lighter)'
       }" (click)="goToPage(i)" style="width: 12px; height: 12px; cursor: pointer; transition: all 0.3s ease;">
    </div>
</div>
