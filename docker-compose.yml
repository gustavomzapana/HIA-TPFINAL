services:
  # nodo uno, sera el bootstrap del cluster
  galera1:
    image: mariadb:10.5
    container_name: galera1
    volumes:
      - ./Docker/mysql/master-conf/my.cnf:/etc/mysql/my.cnf:ro
      - galera1-data:/var/lib/mysql
      - ./Docker/configs/init-users.sql:/docker-entrypoint-initdb.d/init-users.sql
    environment:
      - WSREP_CLUSTER_ADDRESS=gcomm://
      #- WSREP_CLUSTER_ADDRESS=gcomm://galera1,galera2,galera3
      - MARIADB_ROOT_PASSWORD=root
    ports:
      - "3310:3306"
    networks:
      - redCluster
    healthcheck:
      test: ["CMD", "bash", "-c", "mysqladmin ping -h localhost -uroot -proot && mysql -uroot -proot -e \"SHOW STATUS LIKE 'wsrep_ready'\" | grep -q ON"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 40s

  # nodo dos
  galera2:
    image: mariadb:10.5
    container_name: galera2
    volumes:
      - ./Docker/mysql/slave-conf/my.cnf:/etc/mysql/conf.d/my.cnf:ro
      - galera2-data:/var/lib/mysql
    environment:
      - MARIADB_ROOT_PASSWORD=root
    ports:
      - "3311:3306"
    networks:
      - redCluster
    depends_on:
      galera1:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-c", "mysqladmin ping -h localhost -uroot -proot && mysql -uroot -proot -e \"SHOW STATUS LIKE 'wsrep_ready'\" | grep -q ON"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 40s

  # nodo tres
  galera3:
    image: mariadb:10.5
    container_name: galera3
    volumes:
      - ./Docker/mysql/slave2-conf/my.cnf:/etc/mysql/conf.d/my.cnf:ro
      - galera3-data:/var/lib/mysql
    environment:
      - MARIADB_ROOT_PASSWORD=root
    ports:
      - "3312:3306"
    networks:
      - redCluster
    depends_on:
      galera1:
        condition: service_healthy
      galera2:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-c", "mysqladmin ping -h localhost -uroot -proot && mysql -uroot -proot -e \"SHOW STATUS LIKE 'wsrep_ready'\" | grep -q ON"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 40s

  adminer:
    image: adminer
    container_name: adminer
    restart: always
    ports:
      - 8081:8080   # Adminer disponible en http://localhost:8080
    depends_on:
      - haproxy
    networks:
      - redCluster


  haproxy:
    image: haproxy:2.9
    container_name: haproxy
    restart: unless-stopped
    volumes:
      - ./Docker/configs/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    ports:
      - "3307:3306"
    networks:
      - redCluster
    depends_on:
      galera1:
        condition: service_healthy
      galera2:
        condition: service_healthy
      galera3:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Generador de datos masivos
  data-generator:
    build: ./APUNJUbackend/data-generator
    container_name: data-generator
    environment:
      - DB_HOST=haproxy
      - DB_PORT=3306
      - DB_NAME=apunju_db
      - DB_USER=apunju_user
      - DB_PASSWORD=apunju_password
      # Distribución de 500K registros totales
      - TOTAL_REGISTROS=500000
      - USUARIOS=50000          # 10% - Usuarios históricos
      - RECURSOS=8              # Fijo: 5 camionetas + 3 cabañas
      - RESERVAS=200000         # 40% - Reservas por día
      - FECHAS=200000           # 40% - Fechas disponibles por día completo
      - PAGOS=30000             # 6%  - Solo algunos pagos online
      - ACTIVIDADES=10000       # 2%  - Actividades del complejo
      - INSCRIPCIONES=8000      # 1.6% - Inscripciones a actividades
      - NOTICIAS=2000           # 0.4% - Noticias históricas
      - BATCH_SIZE=5000
    networks:
      - redCluster
    depends_on:
      haproxy:
        condition: service_healthy
      backend:
        condition: service_started
    restart: "no"

  # servicio backend para la aplicación APUNJU
  backend:
    image: gaston04gut/apunju-backend:release
    container_name: backend
    # En producción/ejecución por compose usamos el .env específico para Docker
    env_file:
      - ./APUNJUbackend/.env.docker
    ports:
      - "8000:8000"
    networks:
      - redCluster
    depends_on:
      - haproxy
    restart: always
    labels:
      - "com.centurylinklabs.watchtower.enable=true"


  # Frontend Angular
  frontend:
    image: gaston04gut/apunju-frontend:release
    container_name: frontend
    ports:
      - "80:80"  # Puerto estándar HTTP
    environment:
      - API_URL=http://localhost:8000
    networks:
      - redCluster
    depends_on:
      - backend
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    networks:
      - redCluster
    volumes:
      - ./Docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    restart: unless-stopped
    # Se agrega dependencia a los nuevos exporters
    depends_on:
      - mysqld_exporter_galera1
      - mysqld_exporter_galera2
      - mysqld_exporter_galera3

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    networks:
      - redCluster
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana-data:/var/lib/grafana
    restart: unless-stopped
    depends_on:
      - prometheus

#firewall
  firewall:
    build: 
      context: ./Docker/scripts/firewall
      dockerfile: Dockerfile
    container_name: apunju-firewall
    cap_add:
      - NET_ADMIN
    restart: unless-stopped
    networks:
      - redCluster
    depends_on:
      - backend
      - frontend
#exportador de metricas del iptables
  node-exporter:
    build: 
      context: .
      dockerfile: ./Docker/scripts/node-exporter/Dockerfile
    container_name: node-exporter
    volumes:
      - /var/lib/node-exporter:/var/lib/node-exporter
    ports:
      - "9100:9100"
    cap_add:
      - NET_ADMIN
    restart: unless-stopped
    networks:
      - redCluster 
    depends_on:
      - backend
      - frontend
      - haproxy
      - prometheus
      - grafana 
    
  # --- WATCHLOVER ---    
  watchlover:
    image: containrrr/watchtower:latest
    container_name: watchlover
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: --interval 300 --label-enable --cleanup backend frontend
    networks:
      - redCluster
    environment:
      - WATCHTOWER_INCLUDE_STOPPED=false   
      
  # Herramientas de optimización y análisis
  optimization-tools:
    build:
      context: ./Docker
      dockerfile: optimization.Dockerfile
    container_name: optimization-tools
    volumes:
      - ./Docker/optimization-reports:/optimization/reports
      - ./Docker/scripts:/scripts
    networks:
      - redCluster
    depends_on:
      - haproxy
      - galera1
      - galera2
      - galera3
    # Mantener activo esperando comandos
    entrypoint: ["/bin/bash", "-c"]
    command: 
      - |
        echo " Contenedor de optimización listo"
        echo " Ejecuta: docker exec optimization-tools /scripts/run-optimizations.sh"
        tail -f /dev/null
    restart: unless-stopped

  # Contenedor de backups automáticos
  backup-service:
    image: mariadb:10.5
    container_name: backup-service
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - DB_HOST=haproxy
      - DB_PORT=3306
      - DB_NAME=apunju_db
      - BACKUP_RETENTION_DAYS=7
    volumes:
      - ./Docker/backups:/backups
      - ./Docker/scripts:/scripts:ro
    networks:
      - redCluster
    depends_on:
      galera1:
        condition: service_healthy
      galera2:
        condition: service_healthy
      galera3:
        condition: service_healthy
    command: >
      bash -c "
        apt-get update && apt-get install -y cron wget &&
        chmod +x /scripts/*.sh &&
        echo '0 2 * * * /scripts/backup.sh >> /backups/logs/cron.log 2>&1' | crontab - &&
        cron -f
      "
    restart: unless-stopped

  # --- NUEVOS SERVICIOS AÑADIDOS ---
  mysqld_exporter_galera1:
    image: prom/mysqld-exporter
    container_name: exporter1
    command:
      - "--config.my-cnf=/etc/mysql/exporter.cnf"
    volumes:
      - ./Docker/configs/exporter1.cnf:/etc/mysql/exporter.cnf:ro
    networks:
      - redCluster
    depends_on:
      - galera1

  mysqld_exporter_galera2:
    image: prom/mysqld-exporter
    container_name: exporter2
    command:
      - "--config.my-cnf=/etc/mysql/exporter.cnf"
    volumes:
      - ./Docker/configs/exporter2.cnf:/etc/mysql/exporter.cnf:ro
    networks:
      - redCluster
    depends_on:
      - galera2

  mysqld_exporter_galera3:
    image: prom/mysqld-exporter
    container_name: exporter3
    command:
      - "--config.my-cnf=/etc/mysql/exporter.cnf"
    volumes:
      - ./Docker/configs/exporter3.cnf:/etc/mysql/exporter.cnf:ro
    networks:
      - redCluster
    depends_on:
      - galera3

  # Mantis Bug Tracker
  mantisbt:
    image: xlrl/mantisbt:latest
    environment:
    # Configuracion Basica
      MANTIS_TIMEZONE: "America/Argentina/Jujuy"
      MANTIS_ENABLE_ADMIN: 1
    ports:
    - "8989:80"
    networks:
      - redCluster
    volumes:
      # Persistencia de configuración personalizada
      - mantis_config:/var/www/html/config
      - ./mantisbt/config/config_inc.php:/var/www/html/config/config_inc.php
      # Persistencia de personalizaciones (logos, CSS, etc.)
      - mantis_custom:/var/www/html/custom
      # Persistencia de archivos adjuntos
      - mantis_uploads:/var/www/html/mantisbt/uploads
    depends_on:
      haproxy:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
  # --- FIN DE NUEVOS SERVICIOS ---
  servicio-ia:
    build: 
      context: ./Docker/servicio-ia
      dockerfile: Dockerfile
    container_name: anomalias
    environment:
      - DB_HOST=haproxy
      - DB_USER=root
      - DB_PASSWORD=root
      - DB_NAME=apunju_db
      - DB_PORT=3306
    volumes:
      - ./reportes:/reportes
    networks:
      - redCluster
    depends_on:
      haproxy:
        condition: service_healthy
      backend:
        condition: service_started
    # Comando para ejecutar el detector de anomalías cada 24h y no reiniciar el contenedor
    command: ["sh", "-c", "while true; do python /app/src/detector_anomalias.py; sleep 86400; done"]
    restart: unless-stopped
    
volumes:
  galera1-data:
  galera2-data:
  galera3-data:
  grafana-data:
  mantis_config:      # ← Nueva: Configuración de MantisBT
  mantis_custom:      # ← Nueva: Personalizaciones
  mantis_uploads:     # ← Nueva: Archivos adjuntos

networks:
  redCluster:
    external: true