name: CI/CD Pipeline APUNJU

on:
  push:
    branches:
      - develop
  workflow_dispatch: {}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      # 1) Descargar código
      - name: Checkout code
        uses: actions/checkout@v4

      # 2) Configurar herramientas Docker
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3) Login Docker Hub
      - name: Login DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ------------------------------
      #  BACKEND
      # ------------------------------
      - name: Build and Push BACKEND
        uses: docker/build-push-action@v5
        with:
          context: ./APUNJUbackend
          file: ./APUNJUbackend/Dockerfile
          push: true
          no-cache: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/apunju-backend:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/apunju-backend:release

      # ------------------------------
      #  FRONTEND
      # ------------------------------
      - name: Build and Push FRONTEND
        uses: docker/build-push-action@v5
        with:
          context: ./APUNJUfrontend
          file: ./APUNJUfrontend/Dockerfile
          push: true
          no-cache: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/apunju-frontend:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/apunju-frontend:release